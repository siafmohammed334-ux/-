name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir www
          cp index.html questions.js firebase-config.js icon.jpg www/
          cp questions-*.js www/ 2>/dev/null || true

      - name: Install Capacitor and add Android
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "مليونير المعرفة" com.knowledge.millionaire --web-dir www
          npx cap add android

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: find android -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-millionaire-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
