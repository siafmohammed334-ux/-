name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir www
          cp index.html firebase-config.js icon.jpg www/
          cp questions*.js www/

      - name: Install Capacitor and add Android
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "مليونير المعرفة" com.knowledge.millionaire --web-dir www
          npx cap add android

      - name: Set app icon
        run: |
          pip install pillow
          python - <<'EOF'
          from PIL import Image, ImageDraw
          import os, shutil
          im = Image.open("icon.jpg").convert("RGBA").crop((117,127,1932,1950)).resize((1024,1024))
          m = Image.new("L",(1024,1024),0)
          ImageDraw.Draw(m).rounded_rectangle((0,0,1023,1023),radius=230,fill=255)
          im.putalpha(m)
          base = "android/app/src/main/res/"
          for d, s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p = base + "mipmap-" + d + "/"
              os.makedirs(p, exist_ok=True)
              r = im.resize((s,s), Image.LANCZOS)
              for n in ("ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"):
                  r.save(p + n)
          shutil.rmtree(base + "mipmap-anydpi-v26", ignore_errors=True)
          EOF

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-millionaire-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
