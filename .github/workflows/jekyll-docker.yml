name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir www
          cp index.html questions.js firebase-config.js icon.jpg www/

      - name: Install Capacitor and add Android
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npm i -D @capacitor/assets
          npx cap init "مليونير المعرفة" com.knowledge.millionaire --web-dir www
          npx cap add android

      - name: Generate app icon
        continue-on-error: true
        run: |
          mkdir -p assets
          convert icon.jpg -resize 1024x1024 assets/icon.png
          npx capacitor-assets generate
